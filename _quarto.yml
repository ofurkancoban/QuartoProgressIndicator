project:
  type: website # Or default, but website is common for groups of slides

format:
  revealjs:
    extensions:
      - _extensions/ofurkancoban/progress-indicator/
    progress: false # Hide Reveal.js native progress bar
    # You can also set project-wide defaults for the indicator here
    include-in-header:
      - text: |
          <style>
            :root {
              --progress-position: bottom;
              --primary-color: #3366ff;
              --completed-color: #3366ff;
              --dot-size: 8px;
              --section-spacing: 15px;
            }
          </style>
